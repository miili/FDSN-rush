[project]
site_name = "FDSN Rush"
site_url = "https://miili.github.io/FDSN-rush/"
site_description = "Fast and reliable download of seismic waveform data from FDSN web services into an SDS archive."
site_author = "Marius Isken"
copyright = "Copyright &copy; 2025 Marius Isken"

repo_url = "https://github.com/miili/FDSN-rush"
repo_name = "miili/FDSN-rush"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "Selecting stations and channels" = "guides/selecting-data.md" },
    { "Resuming and updating archives" = "guides/resuming.md" },
    { "Restricted data with EIDA tokens" = "guides/restricted-data.md" },
    { "Servers and performance" = "guides/performance.md" },
    { "Scripting and automation" = "guides/scripting.md" },
    { "Working with the archive" = "guides/using-the-archive.md" },
    { "Converting MiniSEED to SDS" = "guides/convert.md" },
  ] },
  { "Reference" = [
    { "Configuration" = "reference/configuration.md" },
    { "Command line" = "reference/cli.md" },
  ] },
]

# Styles the ANSI colours of CLI output rendered by markdown-exec
extra_css = ["stylesheets/ansi.css"]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/audio-waveform"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/miili/FDSN-rush"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  { name = "python", class = "python", validator = "markdown_exec.validator", format = "markdown_exec.formatter" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
