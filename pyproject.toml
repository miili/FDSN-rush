[project]
name = "fdsn-rush"
version = "0.1.0"
description = "Fast and modern FDSN Download"
readme = "README.md"
authors = [{ name = "miili", email = "marius.isken@gfz.de" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.14",
    "pydantic>=2.11.7",
    "pyrocko>=2025.1.21",
    "rich>=14.1.0",
    "typer>=0.16.0",
]

[project.scripts]
fdsn-rush = "fdsn_rush.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["prek>=0.3.5", "pytest>=8.4.1", "pytest-asyncio>=1.1.0", "ruff>=0.16.9"]
docs = [
    "zensical>=0.0.67",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
extend-select = [
    'W',
    'N',
    'DTZ',
    'FA',
    'G',
    'RET',
    'SIM',
    'B',
    'RET',
    'C4',
    'I',
    'RUF',
    'T20',
]
