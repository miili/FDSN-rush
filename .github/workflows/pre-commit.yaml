name: Pre-commit

on:
    pull_request:
    push:
        branches:
            - main
        tags:
            - "*"

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
            - uses: j178/prek-action@v3.0.0
