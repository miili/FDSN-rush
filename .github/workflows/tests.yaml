name: Tests

on:
    pull_request:
    push:
        branches:
            - main
        tags:
            - "*"

jobs:
    pytest:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10
              with:
                  python-version: ${{ matrix.python-version }}
            - run: uv sync --locked
            - run: uv run pytest
